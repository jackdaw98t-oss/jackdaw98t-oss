<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Galgali at EQUAXTION — cybersecurity and software engineering terminal</title>
  <desc id="desc">A dark terminal interface with an ASCII portrait of Galgali, cybersecurity focus, software engineering capabilities, and EQUAXTION contact details.</desc>
  <defs>
    <linearGradient id="topline" x1="0" x2="1">
