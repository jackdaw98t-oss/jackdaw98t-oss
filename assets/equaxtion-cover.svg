      <stop offset="0.5" stop-color="#00d992"/>
      <stop offset="1" stop-color="#00d992" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2e4a41" stroke-width="1" opacity="0.18"/>
    </pattern>
    <clipPath id="portraitClip"><rect x="42" y="104" width="398" height="422" rx="4"/></clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { fill:#6c8d82; font-size:12px; font-weight:700; letter-spacing:2.2px; }
      .value { fill:#effbf6; font-size:16px; font-weight:600; }
      .body { fill:#a7beb6; font-size:14px; }
      .chip { fill:#d8eee6; font-size:12px; font-weight:700; letter-spacing:.8px; }
    </style>
  </defs>

