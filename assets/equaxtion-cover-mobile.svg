      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .prompt { fill:#00d992; font-size:15px; font-weight:700; letter-spacing:1.3px; }
      .muted { fill:#718b82; }
      .body { fill:#afc2bb; font-size:18px; }
      .strong { fill:#f2faf7; font-weight:700; }
