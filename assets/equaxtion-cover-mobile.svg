<svg xmlns="http://www.w3.org/2000/svg" width="760" height="760" viewBox="0 0 760 760" role="img" aria-labelledby="title desc">
  <title id="title">Galgali at EQUAXTION — Cybersecurity and software engineering</title>
  <desc id="desc">Mobile corporate profile cover for Galgali at EQUAXTION.</desc>
  <defs>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d992"/>
      <stop offset="1" stop-color="#00d992" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .eyebrow { fill:#8d9692; font-size:17px; font-weight:700; letter-spacing:2.8px; }
      .display { fill:#f5f7f6; font-size:57px; font-weight:750; letter-spacing:-1.7px; }
      .body { fill:#b8c0bd; font-size:23px; font-weight:500; }
      .meta { fill:#b8c0bd; font-size:20px; font-weight:600; }
    </style>
  </defs>

  <rect width="760" height="760" fill="#07090c"/>
  <rect x="1" y="1" width="758" height="758" fill="none" stroke="#292e33"/>
  <rect x="0" y="0" width="10" height="760" fill="#00d992"/>

  <g class="sans">
    <text x="54" y="72" class="eyebrow">EQUAXTION · MOROCCO</text>

    <text x="54" y="184" class="display">SECURE THE</text>
    <text x="54" y="254" class="display">SYSTEM.</text>
    <text x="54" y="346" class="display">BUILD THE</text>
    <text x="54" y="416" class="display">BUSINESS.</text>

    <rect x="54" y="463" width="560" height="2" fill="url(#signal)"/>
    <text x="54" y="510" fill="#f5f7f6" font-size="24" font-weight="700">GALGALI</text>
    <text x="54" y="550" fill="#f5f7f6" font-size="27" font-weight="650">Senior Cybersecurity Analyst</text>
    <text x="54" y="588" fill="#f5f7f6" font-size="27" font-weight="650">× Software Engineer</text>
    <text x="54" y="635" class="body">Cybersecurity · Software · ERP · AI</text>

    <text x="54" y="695" class="meta">equaxtion.com</text>
    <text x="54" y="729" class="meta">contact@equaxtion.com</text>
    <circle cx="692" cy="707" r="7" fill="#00d992"/>
