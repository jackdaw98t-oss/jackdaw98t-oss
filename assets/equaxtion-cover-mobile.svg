<svg xmlns="http://www.w3.org/2000/svg" width="760" height="960" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
  <title id="title">Galgali at EQUAXTION — mobile cybersecurity terminal</title>
  <desc id="desc">A mobile terminal interface with an ASCII portrait of Galgali and EQUAXTION cybersecurity and software engineering identity.</desc>
  <defs>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2e4a41" stroke-width="1" opacity="0.18"/>
    </pattern>
    <clipPath id="portraitClip"><rect x="54" y="108" width="652" height="468" rx="4"/></clipPath>
    <style>
      .sans { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { fill:#6c8d82; font-size:15px; font-weight:700; letter-spacing:2.4px; }
      .value { fill:#effbf6; font-size:25px; font-weight:700; }
      .body { fill:#a7beb6; font-size:19px; font-weight:500; }
    </style>
  </defs>

