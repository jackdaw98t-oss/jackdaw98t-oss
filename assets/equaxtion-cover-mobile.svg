<svg xmlns="http://www.w3.org/2000/svg" width="760" height="960" viewBox="0 0 760 960" role="img" aria-labelledby="title desc">
  <title id="title">Galgali at EQUAXTION — mobile cybersecurity terminal</title>
  <desc id="desc">A restrained mobile terminal with Galgali's ASCII portrait, cybersecurity role, mission, and EQUAXTION contact details.</desc>
  <defs>
    <linearGradient id="topline" x1="0" x2="1">
